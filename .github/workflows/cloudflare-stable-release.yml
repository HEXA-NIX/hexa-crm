name: Deploy Cloudflare stable release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: cloudflare-stable
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npx wrangler d1 migrations apply hexa-crm --remote --config workers/cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy --config workers/cloudflare/wrangler.jsonc --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
