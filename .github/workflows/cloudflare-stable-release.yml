name: Deploy Cloudflare stable release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de una release estable publicada que se debe redesplegar
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-stable
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'release' && github.event.release.prerelease == false && github.event.release.draft == false)
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          submodules: recursive
      - name: Verify requested stable release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          --json isDraft,isPrerelease
          --jq 'select(.isDraft == false and .isPrerelease == false)' > /dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npx wrangler d1 migrations apply hexa-crm --remote --config workers/cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy --config workers/cloudflare/wrangler.jsonc --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
